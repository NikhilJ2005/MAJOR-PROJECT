[project]
name = "vibestack"
version = "0.1.0"
description = "Agentic harness that turns natural language into validated, self-healed FastAPI backends"
requires-python = ">=3.11"
dependencies = [
    # harness
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-openai>=0.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.28",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    # runtime deps of *generated* projects, pre-installed so the local sandbox
    # never has to pip install during a run
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "pytest>=8.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
