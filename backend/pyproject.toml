[project]
name = "vibestack"
version = "0.1.0"
description = "Agentic harness that turns natural language into validated, self-healed FastAPI backends"
requires-python = ">=3.11"
dependencies = [
    # harness
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langgraph-checkpoint-postgres>=2.0",  # used when PLATFORM_DATABASE_URL is Postgres
    "psycopg[binary]>=3.1",
    "langchain-openai>=0.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.28",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "mcp>=2.0",  # VibeStack as an MCP server (app/mcp_server.py)
    "redis>=5.0",  # build queue for worker processes (app/queue.py); also generated apps' shared rate limits
    # runtime deps of *generated* projects (FastAPI, Flask and Django), pre-installed
    # so the local sandbox never has to pip install during a run
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "flask>=3.0",
    "django>=5.1",
    "pydantic>=2.6",
    "pyjwt>=2.8",
    "boto3>=1.34",  # optional S3-compatible storage for generated zips (app/storage.py)
    "httpx>=0.27",
    "pytest>=8.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "moto[s3]>=5", "fakeredis>=2.20"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "app*", "evals*"]

[tool.setuptools.package-data]
agent = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
