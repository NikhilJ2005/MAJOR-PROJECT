# Render Blueprint: New -> Blueprint -> pick this repo. One web service (the Dockerfile) plus a
# managed Postgres. Fill the secrets marked sync: false in the Render dashboard. See docs/DEPLOY.md.
services:
  - type: web
    name: vibestack
    runtime: docker
    plan: standard              # 2 GB: builds run generated apps and their tests inside this service
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PLATFORM_DATABASE_URL
        fromDatabase:
          name: vibestack-db
          property: connectionString
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: ACCESS_CODE
        sync: false
      # Zips in object storage, so the service needs no disk. Cloudflare R2:
      # S3_ENDPOINT_URL=https://<account_id>.r2.cloudflarestorage.com
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto

databases:
  - name: vibestack-db
    plan: basic-256mb
    region: singapore
