# The web server: API, UI, event streams and live previews. It queues builds; workers run them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibestack-web
spec:
  replicas: 2
  selector:
    matchLabels: {app: vibestack-web}
  template:
    metadata:
      labels: {app: vibestack-web}
    spec:
      containers:
        - name: web
          image: vibestack
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: vibestack-config}
            - secretRef: {name: vibestack-secrets}
          readinessProbe:
            httpGet: {path: /api/health, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 2Gi}   # live previews run generated apps in this pod
---
apiVersion: v1
kind: Service
metadata:
  name: vibestack-web
spec:
  selector: {app: vibestack-web}
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vibestack-web
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: vibestack-web}
