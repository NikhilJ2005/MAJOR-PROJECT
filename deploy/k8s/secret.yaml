# Example values: replace them (or create the Secret with kubectl/your secret manager) and never commit real ones.
#   kubectl -n vibestack create secret generic vibestack-secrets --from-env-file=secrets.env
apiVersion: v1
kind: Secret
metadata:
  name: vibestack-secrets
type: Opaque
stringData:
  SECRET_KEY: change-me-to-a-long-random-string
  GEMINI_API_KEY: change-me
  PLATFORM_DATABASE_URL: postgresql://vibestack:password@your-postgres:5432/vibestack   # managed Postgres
  ADMIN_EMAILS: you@example.com
  S3_BUCKET: vibestack-artifacts
  S3_ENDPOINT_URL: https://your-s3-endpoint
  S3_ACCESS_KEY_ID: change-me
  S3_SECRET_ACCESS_KEY: change-me
