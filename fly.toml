# Fly.io: fly launch --copy-config --no-deploy, then
#   fly postgres create  &&  fly postgres attach <name>      (sets DATABASE_URL)
#   fly secrets set PLATFORM_DATABASE_URL=<that url> GEMINI_API_KEY=... SECRET_KEY=... S3_BUCKET=... ...
#   fly deploy
app = "vibestack"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  LLM_PROVIDER = "gemini"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"   # builds run in the server: do not stop a machine in the middle of one
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
