name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check agent app tests evals scripts plugins
      - name: Unit, graph and HTTP tests (fake model, real sandbox)
        run: pytest -q
      - name: Offline evals on every framework (no model, templates only)
        run: |
          for stack in fastapi flask django; do
            python -m evals.run --offline --stack "$stack"
          done

  # The same platform tests against a real Postgres (accounts, projects, versions, checkpoints).
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vibestack
          POSTGRES_PASSWORD: vibestack
          POSTGRES_DB: vibestack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vibestack" --health-interval 5s --health-retries 10
    env:
      PLATFORM_DATABASE_URL: postgresql://vibestack:vibestack@localhost:5432/vibestack
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_projects.py tests/test_api.py tests/test_github.py tests/test_ops.py

  # The whole product in a real browser with the offline model.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" playwright && python -m playwright install --with-deps chromium
        working-directory: backend
      - name: Browser smoke test
        working-directory: backend
        env:
          FAKE_LLM: "1"
        run: |
          uvicorn app.main:app --port 8766 &
          for i in $(seq 1 60); do curl -sf localhost:8766/api/health && break; sleep 1; done
          python scripts/ui_smoke.py /tmp

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vibestack .
